# Research Program — single source for the homepage section.
#
# Every item renders as: Research Snap → label → title → contribution →
# authors / venue → links. Edit text and links here; no template changes needed.
#
# Research Snap options, checked in this order:
#   snap:          name of a built-in hand-drawn diagram (`acfgm` or `ar`)
#   figure_pages:  a multi-page scan — a list of `{file, alt}` entries, shown one
#                  page at a time with a page flipper
#   figure:        a single image under assets/media/ — e.g.
#                  `research/strong-solutions.svg` (figure_alt is then required)
#   neither: a sized placeholder is drawn, so the page rhythm holds until the
#            real figure lands.
#
# `tags:` is a short list of current-focus areas the item belongs to. They are
# labels, not links — there is no tag index to point at.
#
# `pending: true` suppresses the authors / venue / links row and prints a short
# "details to come" note instead — used where metadata is not settled yet.

heading: Research Interests and Selected Works

