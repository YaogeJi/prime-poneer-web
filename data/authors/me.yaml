bio: |
  I am an H. Milton Stewart Postdoctoral Fellow in the [H. Milton Stewart School of Industrial and Systems Engineering](https://www.isye.gatech.edu/) at [Georgia Tech](https://www.gatech.edu/) advised by [Prof. Guanghui (George) Lan](https://sites.gatech.edu/guanghui-lan/).

# Rendered below the education / experience timeline
bio_research: |
  My current focus is on <span class="rterm" data-topic="parameter-free">optimal parameter-free methods</span> for stochastic optimization. I study <span class="rterm" data-topic="high-order">first- and higher-order methods</span> for convex and nonconvex problems in both deterministic and stochastic settings. I have worked on <span class="rterm" data-topic="gradient-min">gradient minimization</span>, <span class="rterm" data-topic="variational-inequalities">variational inequalities</span>, <span class="rterm" data-topic="distributed">distributed optimization</span>, <span class="rterm" data-topic="statistical-learning">statistical learning</span>, and <span class="rterm" data-topic="reinforcement-learning">reinforcement learning</span>, including <span class="rterm" data-topic="healthcare">applications in healthcare</span>.

